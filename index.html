<!doctype html>

  <head>
    <script>
      // Fix for extensions/interceptors attempting to override window.fetch when it only has a getter
      (function() {
        try {
          var _nativeFetch = window.fetch;
          var _currentFetch = _nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback if property definition fails
        }

        // Intercept and suppress external browser extension runtime errors
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.includes('chrome-extension://')) ||
            (event.message && event.message.includes('fetch of #<Window>'))
          ) {
            event.preventDefault();
            event.stopPropagation();
            return false;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = reason && (reason.message || reason.stack || String(reason));
          if (msg && (msg.includes('chrome-extension://') || msg.includes('fetch of #<Window>'))) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
